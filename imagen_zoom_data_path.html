<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen con Zoom y Pan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }

        .zoom-container {
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            cursor: grab;
        }

        #zoomableImage {
            width: 100%;
            height: auto;
            display: block;
            transform-origin: 0 0;
            transition: transform 0.2s ease-in-out;
            touch-action: none;
        }

        .controls {
            text-align: center;
            margin-top: 10px;
        }

        .controls button {
            padding: 8px 15px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #eee;
            border-radius: 4px;
            font-size: 16px;
        }

        .controls button:hover {
            background-color: #ddd;
        }

        .zoom-container.is-dragging {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ruta Data-Driven</h1>
        <p>Utiliza los botones de zoom o la rueda del ratón para acercar y alejar. Haz clic y arrastra para mover la imagen.</p>
        
        <div class="zoom-container">
            <img id="zoomableImage" src="https://drive.google.com/uc?export=view&id=1xcgJQfdZWlorvMs_IjeQYQpaa89Hefjz" alt="Ruta Data-Driven con detalles de los módulos">
        </div>

        <div class="controls">
            <button onclick="zoomIn()">+</button>
            <button onclick="zoomOut()">-</button>
            <button onclick="resetZoom()">Restablecer Zoom</button>
        </div>
    </div>

    <script>
        const container = document.querySelector('.zoom-container');
        const img = document.getElementById('zoomableImage');
        let scale = 1;
        let translateX = 0;
        let translateY = 0;

        function applyTransform() {
            img.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
            img.style.cursor = scale > 1 ? 'grab' : 'default';
        }

        function zoomIn() {
            scale = Math.min(3, scale + 0.2);
            applyTransform();
        }

        function zoomOut() {
            scale = Math.max(1, scale - 0.2);
            if (scale === 1) {
                translateX = 0;
                translateY = 0;
            }
            applyTransform();
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            applyTransform();
        }

        let isDragging = false;
        let startX, startY;
        let startTranslateX, startTranslateY;

        img.addEventListener('mousedown', (e) => {
            if (scale > 1) {
                e.preventDefault();
                isDragging = true;
                container.classList.add('is-dragging');
                startX = e.clientX;
                startY = e.clientY;
                startTranslateX = translateX;
                startTranslateY = translateY;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = (e.clientX - startX) / scale;
            const dy = (e.clientY - startY) / scale;
            translateX = startTranslateX + dx;
            translateY = startTranslateY + dy;
            applyTransform();
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                container.classList.remove('is-dragging');
            }
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const oldScale = scale;
            const delta = e.deltaY < 0 ? 0.2 : -0.2;
            scale = Math.max(1, Math.min(3, scale + delta));
            const newMouseX = (mouseX / oldScale) * scale;
            const newMouseY = (mouseY / oldScale) * scale;
            translateX = translateX + ((mouseX / oldScale) - (newMouseX / scale));
            translateY = translateY + ((mouseY / oldScale) - (newMouseY / scale));
            if (scale === 1) {
                translateX = 0;
                translateY = 0;
            }
            applyTransform();
        });

        let touchStart = {};

        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startTranslateX = translateX;
                startTranslateY = translateY;
            }
            if (e.touches.length === 2) {
                touchStart.distance = getPinchDistance(e.touches);
            }
        });

        img.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const dx = (e.touches[0].clientX - startX) / scale;
                const dy = (e.touches[0].clientY - startY) / scale;
                translateX = startTranslateX + dx;
                translateY = startTranslateY + dy;
                applyTransform();
            } else if (e.touches.length === 2) {
                const distance = getPinchDistance(e.touches);
                const deltaScale = (distance - touchStart.distance) * 0.005;
                const newScale = Math.max(1, Math.min(3, scale + deltaScale));
                const pinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const pinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const rect = img.getBoundingClientRect();
                const mouseX = pinchCenterX - rect.left;
                const mouseY = pinchCenterY - rect.top;
                const newMouseX = (mouseX / scale) * newScale;
                const newMouseY = (mouseY / scale) * newScale;
                translateX = translateX + ((mouseX / scale) - (newMouseX / newScale));
                translateY = translateY + ((mouseY / scale) - (newMouseY / newScale));
                scale = newScale;
                applyTransform();
            }
        });

        img.addEventListener('touchend', () => {
            isDragging = false;
        });

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
    </script>
</body>
</html>
